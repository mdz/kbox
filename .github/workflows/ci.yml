name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Runner images are pinned to a release rather than tracking `ubuntu-latest`.
  # GitHub publishes no rolling arm64 alias (there is no `ubuntu-latest-arm`,
  # only version-pinned labels), so the arm leg must name a release. Leaving
  # amd64 on `ubuntu-latest` therefore let the two architectures drift apart
  # silently when `ubuntu-latest` rolled from 24.04 to 26.04. Bump these labels
  # together, in their own PR, so the move is deliberate and reviewable.
  #
  # The test matrix runs pytest inside the Docker image (debian:stable-slim), so
  # the runner's Ubuntu release affects only the kernel and Docker daemon, not
  # the userspace under test. The host release matters most to `e2e`, which
  # installs Playwright directly on the runner.

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - name: Type check with mypy
        run: uv run mypy kbox

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: kbox-test
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Run tests
        run: docker run --rm kbox-test uv run pytest -v

  e2e:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: uv run pytest -m e2e -v
