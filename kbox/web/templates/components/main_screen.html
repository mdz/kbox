<!-- Sticky turn alert (driven by renderUpNext) -->
<div id="turn-bar" class="turn-bar" role="status" aria-live="polite" hidden></div>

<!-- Main Content -->
<div class="main-content" id="main-content">
    <!-- Who this phone is singing as, with a way to switch (auth.js) -->
    <div id="identity-line" class="identity-line hide-while-singing" hidden>
        Singing as <strong id="identity-name"></strong>
        · <button type="button" class="identity-change" onclick="showChangeNameModal()">Not you?</button>
    </div>
    <!-- Search Section (hidden while it's this guest's song) -->
    <div class="section hide-while-singing">
        {% if suggestion_theme %}
        <div class="party-theme">🎭 Tonight's theme: <span class="party-theme-value">{{ suggestion_theme }}</span></div>
        {% endif %}
        <div id="replace-target-banner" class="replace-target-banner hidden"></div>
        <form id="search-form" onsubmit="search(); return false;" action="javascript:void(0);">
            <div class="search-input-wrap">
                <input type="text" id="search-input" placeholder="Search for a song..."
                       autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                       role="combobox" aria-expanded="false" aria-autocomplete="list"
                       aria-controls="search-suggestions" />
                <!-- Shown by CSS whenever the box has text, so it tracks values
                     set from script (Fix, add-to-queue) as well as typing. -->
                <button type="button" id="search-clear" class="search-clear"
                        aria-label="Clear search">&times;</button>
            </div>
            <button type="submit" id="search-button">Search</button>
            <!-- Anchored to the form, not the input: hanging it directly under
                 the input would put it on top of the Search button. -->
            <ul id="search-suggestions" class="search-suggestions hidden"
                role="listbox" aria-label="Search suggestions"></ul>
        </form>
        {% if ai_suggestions_enabled %}
        <div id="suggest-button-container">
            <button type="button" id="suggest-button" onclick="getSuggestions()">✨ Suggest for me</button>
        </div>
        {% endif %}
        <div id="search-results" class="search-results"></div>
    </div>

    <!-- Now Playing Section -->
    <div class="section now-playing" id="now-playing-section">
        <h2>Now Playing</h2>
        <div id="now-playing-content">
            <!-- Rendered by JavaScript -->
        </div>
    </div>

    <!-- Playback Controls Section (Operator Only) -->
    <div class="section operator-panel" id="playback-controls-section" style="display: none;">
        <h2>Playback Controls</h2>
        <div id="playback-controls-content">
            <div class="controls" id="playback-buttons-section" style="display: none;">
                <div class="controls-row">
                    <button id="play-pause-toggle" onclick="togglePlayPause(); resetPlaybackAutoLockTimer()">▶ Play</button>
                    <button onclick="stopPlayback(); resetPlaybackAutoLockTimer()">⏹ Stop</button>
                </div>
                <div class="controls-row">
                    <button onclick="playback('previous'); resetPlaybackAutoLockTimer()">⏮ Previous</button>
                    <button onclick="playback('skip'); resetPlaybackAutoLockTimer()">⏭ Skip</button>
                </div>
                <div class="controls-row" style="grid-template-columns: 1fr 1fr 1fr;">
                    <button onclick="seekBackward(); resetPlaybackAutoLockTimer()">⏪ -10s</button>
                    <button onclick="restartSong(); resetPlaybackAutoLockTimer()">↺ Restart</button>
                    <button onclick="seekForward(); resetPlaybackAutoLockTimer()">+10s ⏩</button>
                </div>
            </div>
            <button id="playback-lock-button" onclick="togglePlaybackControlsLock()" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; background: #555;">🔒 Unlock Controls</button>
        </div>
    </div>

    <!-- Queue Section (hidden while it's this guest's song) -->
    <div class="section hide-while-singing">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">Queue</h2>
            <div id="clear-queue-button-container"></div>
        </div>
        <div id="queue-list"></div>
    </div>
</div>
