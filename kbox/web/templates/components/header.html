<!-- Header (always visible) -->
<header style="position: relative; margin-bottom: 20px;">
    <button class="controls-toggle-button" id="operator-auth-button" onclick="promptOperatorAuth()" title="Operator Authentication" aria-label="Operator sign-in">🔑</button>
    <button class="config-toggle-button" id="config-toggle-button" onclick="toggleConfigScreen()" title="Open Configuration" aria-label="Open configuration">⚙</button>
    <button class="history-button" onclick="showHistoryModal()" title="My song history" aria-label="My song history">🕘</button>
    <button class="favorites-button" onclick="showFavoritesModal()" title="My favorites" aria-label="My favorites">⭐</button>
    <button class="help-button" onclick="showHelp()" title="How kbox works" aria-label="Help: how kbox works">?</button>
    <h1 class="wordmark"><span class="wordmark-k">k</span><span class="wordmark-box">box</span></h1>
</header>
