services:
  kbox:
    # Pre-built multi-arch image from Docker Hub. `latest` is the newest verified
    # release; pin an exact version (e.g. 0.2.0, or 0.2.0-rc.1 for a pre-release).
    image: mdzz/kbox:latest
    # To build from source instead, comment out `image:` above and use:
    # build: .
    devices:
      - "/dev/snd:/dev/snd"
      - "/dev/dri:/dev/dri"  # For KMS video
    ports:
      - "8000:8000"
    volumes:
      - kbox-data:/root/.kbox  # Persist database and config
      - kbox-library:/root/.kbox/library  # Persist downloaded video library
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - kbox
    restart: unless-stopped

volumes:
  kbox-library:
  kbox-data:
