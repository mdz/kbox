# `pre-commit install` wires up both hook types. Without pre-push listed here
# it installs only the commit hook, and anything with `stages: [pre-push]`
# below never runs -- which is how the pytest hook sat dormant.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Standard pre-commit hooks for best practices
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb, '1000']
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-case-conflict
      - id: detect-private-key

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy kbox
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        # No -m here on purpose. pyproject.toml's addopts already carries
        # `-m "not e2e and not benchmark"`, and pytest's -m is single-valued,
        # so any -m on the command line replaces that filter instead of
        # narrowing it -- which pulled the Playwright e2e suite and the
        # hardware benchmarks into the push gate (900 tests collected rather
        # than 824). The marker it filtered on, `gstreamer`, was never
        # registered or applied to anything either.
        entry: uv run pytest -x -q
        language: system
        pass_filenames: false
        stages: [pre-push]
